services:
  postgres:
    image: postgres:18.6
    container_name: autohub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub_dev
      POSTGRES_DB: autohub

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: